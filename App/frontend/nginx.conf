server {
    listen 80;
    server_name localhost;

    # 1. Servir el frontend compilado (React SPA)
    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    # 2. Proxy Inverso para el Backend en Go
    location /api/ {
        # envsubst reemplaza ${BACKEND_URL} por la URL del backend al iniciar el contenedor.
        # En local (docker-compose): http://backend:8080
        # En producción (Render): https://miapp-api-qa-w60e.onrender.com
        proxy_pass ${BACKEND_URL};

        # Importante: NO fijamos 'proxy_set_header Host $http_host'.
        # Nginx usa por defecto $proxy_host (el dominio del backend).
        # Esto evita que Render confunda la petición y cause un bucle (error 508).

        # Reenvía la IP real del cliente al backend para logging/auditoría
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Habilita SNI (Server Name Indication) para backends HTTPS (ej: Render)
        proxy_ssl_server_name on;
        proxy_ssl_verify off;
    }
}

