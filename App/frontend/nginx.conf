server {
    listen 80;
    server_name localhost;

    # Resolver DNS:
    # - 127.0.0.11: DNS interno de Docker, resuelve nombres de servicios del compose (ej: 'backend')
    # - 1.1.1.1 / 8.8.8.8: DNS públicos (Cloudflare y Google) para hostnames externos en producción
    # valid=30s: cachea la IP por 30 segundos antes de volver a consultar
    resolver 127.0.0.11 1.1.1.1 8.8.8.8 valid=30s;

    # 1. Servir el frontend compilado (React SPA)
    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    # 2. Proxy Inverso para el Backend en Go
    location /api/ {
        # envsubst reemplaza ${BACKEND_URL} por el valor de entorno al iniciar el contenedor.
        # Al asignarlo a una variable de Nginx ($backend), se activa la resolución dinámica
        # de DNS (requiere el resolver de arriba). Sin esto, Nginx solo resuelve al arrancar.
        set $backend "${BACKEND_URL}";

        # proxy_pass con variable NO stripea el prefijo /api/ de la URL entrante.
        proxy_pass $backend;

        # Envía el Host original del browser al backend (no el hostname interno de Nginx)
        proxy_set_header Host $http_host;

        # Reenvía la IP real del cliente al backend para logging/auditoría
        proxy_set_header X-Real-IP $remote_addr;

        # Habilita SNI (Server Name Indication) para que el handshake TLS
        # funcione correctamente con backends HTTPS (ej: Render, Heroku)
        proxy_ssl_server_name on;

        # Desactiva la verificación del certificado TLS del backend.
        # Necesario porque el contenedor Nginx no tiene acceso al bundle de
        # certificados del SO para validar el cert de *.onrender.com
        proxy_ssl_verify off;
    }
}
